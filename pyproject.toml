[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hlidskjalv"
version = "0.3.0"
description = "A game-like, local-only live map of your coding workflow: files, commands, Git and AI steps, with hover explanations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []          # standard library only, on purpose

[project.urls]
Homepage = "https://github.com/alexb-joat/hlidskjalv"
Issues = "https://github.com/alexb-joat/hlidskjalv/issues"

[project.scripts]
hlidskjalv = "hlidskjalv.__main__:main"

[tool.setuptools]
packages = ["hlidskjalv"]

[tool.setuptools.package-data]
hlidskjalv = ["static/*.html", "static/vendor/*"]
