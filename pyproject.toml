[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hlidskjalv"
version = "0.3.0"
description = "A game-like, local-only live map of your coding workflow: files, commands, Git and AI steps, with hover explanations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []          # standard library only, on purpose

[project.urls]
Homepage = "https://github.com/alexb-joat/hlidskjalv"
Issues = "https://github.com/alexb-joat/hlidskjalv/issues"

[project.scripts]
hlidskjalv = "hlidskjalv.__main__:main"

[tool.setuptools]
packages = ["hlidskjalv"]

[tool.setuptools.package-data]
hlidskjalv = ["static/*.html", "static/*.js", "static/vendor/*"]

[tool.ruff]
line-length = 160          # the code's own width: long lines here are messages and tables, not deep nesting

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade and the bandit security rules.
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S603/S606 flag every subprocess call and exec; the checks that matter stay on: shell=True
# (S602, S605) and a program found through PATH (S607). Hlidskjalv runs fixed argument lists.
ignore = ["S603", "S606"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, write temp files, use fake secrets and short one-line setups on purpose.
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S310", "S607", "E701", "E702", "E731"]
