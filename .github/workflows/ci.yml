name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run by hand on any branch: gh workflow run ci.yml --ref <branch>

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 is the Windows 10 generation (kernel 10.0.20348), windows-2025 the
        # Windows 11 generation (10.0.26100). GitHub has no Windows 10/11 desktop x64 images.
        os: [ubuntu-latest, macos-latest, windows-2022, windows-2025]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (standard library only, nothing to install)
        run: python -m unittest discover -s tests -t . -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install the linter (hash-verified; a development tool, not a dependency)
        run: pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Ruff (rules in pyproject.toml)
        run: ruff check --output-format=github .
