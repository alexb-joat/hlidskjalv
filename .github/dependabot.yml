version: 2
updates:
  - package-ecosystem: pip   # requirements-dev.txt: the linter only
    directory: /
    schedule: { interval: weekly }
    # Hold new releases for a week: most hijacked packages are pulled within days.
    cooldown: { default-days: 7 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
